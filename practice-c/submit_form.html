<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Format</title>

</head>

<body>
  <center>
    <h1>registration form</h1>
    <form action="tarun.html" method="get">

      <label for="name ">Name</label>
      <input type="text" placeholder="enter name" id=" name" name="namer" required>
      <br><br>
      <label for="email">Email</label>
      <input type="email" placeholder="enter email" id="email" name="email" required>
      <br><br>
      <label for="password">Passworld</label>
      <input type="password" placeholder="enter password" id="password" registration>
      <br><br>
      <label for="dob">
        Date of Birth
      </label>
      <input type="date" id="dob" name="dob" required>
      <br><br>
      <p>Gender</p>
      <input type="radio" name="gender" value="Male" id="male">
      <label for=" male">Male</label>

      <input type="radio" name="gender" id="female">
      <label for="female">Female</label>
      <br><br>
      <label for="country">
        country
      </label>
      <select name="country" id="country">
        <option value="INDIA">INDIA</option>
        <option value="AUSTRALIA">AUSTRALIA</option>
        <option value="USA">USA</option>
      </select>
      <br><br>
      <label for="about">
        About your:
      </label>
      <textarea name="feedback" id="about" rows="5" cols="40"></textarea>
      <br><br>

      <input type="submit" value="submit">
    </form>
    </center6>
</body>

</html>
